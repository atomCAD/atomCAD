  <rect width="1700" height="720" fill="#F8FAFC"/>
  
  <text x="850.0" y="40" class="title">atomCAD Architecture</text>
  <text x="850.0" y="65" class="subtitle">Every Rust circle is a cargo crate: atomcad-&lt;name&gt;, except api = the root package rust_lib_flutter_cad. The DAG is compiler-enforced.</text>
  <text x="850.0" y="86" class="subtitle">Circle area proportional to lines of code in src/ • Arrows point to dependencies (some are cut for clarity)</text>

