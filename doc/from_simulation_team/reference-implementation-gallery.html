<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>One field, nine instruments — T-center spin density</title>
<style>
:root{
  --bg:#0b0e14; --panel:#11151d; --panel2:#161b25; --line:#232a38;
  --txt:#dce3ee; --mut:#8b95a7; --dim:#5c6575;
  --pos:#f5a25e; --neg:#6fa6ff; --gold:#ffd166; --phos:#7df0a8;
}
*{box-sizing:border-box; margin:0; padding:0}
html,body{height:100%}
body{background:var(--bg); color:var(--txt); font:14px/1.45 -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; overflow:hidden}
header{display:flex; align-items:baseline; justify-content:space-between; gap:16px; padding:10px 16px 8px; border-bottom:1px solid var(--line)}
h1{font-size:16px; font-weight:600; letter-spacing:.2px; white-space:nowrap}
#identity{font-size:11.5px; color:var(--mut); font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; text-align:right; line-height:1.5}
#identity b{color:var(--txt); font-weight:600}
main{display:flex; height:calc(100% - 46px)}
nav{width:212px; min-width:212px; border-right:1px solid var(--line); padding:10px 8px; overflow-y:auto; background:var(--panel)}
nav button.viewbtn{display:block; width:100%; text-align:left; background:none; border:1px solid transparent; border-radius:8px; color:var(--txt); padding:7px 10px 6px; margin-bottom:4px; cursor:pointer; font:inherit}
nav button.viewbtn:hover{background:var(--panel2)}
nav button.viewbtn.act{background:var(--panel2); border-color:var(--line)}
nav button.viewbtn .nm{font-weight:600; font-size:13px}
nav button.viewbtn .sub{display:block; font-size:11px; color:var(--mut); margin-top:1px}
#gctl{margin-top:10px; padding:10px 8px 4px; border-top:1px solid var(--line); font-size:12px; color:var(--mut)}
#gctl label{display:block; margin-bottom:8px}
#gctl input[type=range]{width:100%; accent-color:var(--pos)}
#gctl .row{display:flex; gap:6px; margin-bottom:8px}
button.tb{background:var(--panel2); color:var(--txt); border:1px solid var(--line); border-radius:6px; padding:4px 8px; font-size:12px; cursor:pointer}
button.tb:hover{border-color:#3a4456}
button.tb.on{background:#22304a; border-color:#3d5b8c}
select.tb{background:var(--panel2); color:var(--txt); border:1px solid var(--line); border-radius:6px; padding:4px 6px; font-size:12px}
#isoRead{font-family:ui-monospace,Menlo,Consolas,monospace; font-size:11.5px; color:var(--txt)}
#stage{position:relative; flex:1; display:flex; flex-direction:column; min-width:0}
#cv{flex:1; width:100%; height:100%; display:block; cursor:grab; touch-action:none}
#hud{position:absolute; top:10px; left:12px; display:flex; gap:6px; flex-wrap:wrap; max-width:70%}
footer{position:absolute; left:0; right:0; bottom:0; padding:8px 14px; font-size:12px; color:var(--mut); background:linear-gradient(transparent, rgba(11,14,20,.92) 40%); pointer-events:none}
footer b{color:var(--txt)}
#splash{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; background:var(--bg); z-index:9; color:var(--mut); font-size:13px}
#toast{position:absolute; top:12px; right:12px; background:#2a1620; border:1px solid #5c2436; color:#f0c4cf; padding:8px 12px; border-radius:8px; font-size:12px; display:none; z-index:8}
body.drag #dropveil{display:flex}
#dropveil{position:fixed; inset:0; display:none; align-items:center; justify-content:center; background:rgba(11,14,20,.85); border:2px dashed #3d5b8c; z-index:20; font-size:15px; color:var(--txt); pointer-events:none}
</style>
</head>
<body>
<header>
  <h1>One field, nine instruments</h1>
  <div id="identity">loading…</div>
</header>
<main>
  <nav id="nav"></nav>
  <section id="stage">
    <canvas id="cv"></canvas>
    <div id="hud"></div>
    <footer id="caption"></footer>
    <div id="splash">decompressing spin density…</div>
    <div id="toast"></div>
  </section>
</main>
<div id="dropveil">drop the .cube to load it</div>

async function inflateB64(b64){
  const bin=atob(b64); const bytes=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
  const ds=new DecompressionStream('gzip');
  const buf=await new Response(new Blob([bytes]).stream().pipeThrough(ds)).arrayBuffer();
  return new Uint8Array(buf);
}

class Field{
  constructor(meta, data, atoms){
    this.meta=meta; this.n=meta.n; this.box=meta.boxA; this.vmax=meta.vmax;
    this.data=data; this.atoms=atoms;
    const N=this.n*this.n*this.n;
    const abs=new Float32Array(N);
    for(let i=0;i<N;i++) abs[i]=Math.abs(data[i]);
    const sorted=abs.slice().sort((a,b)=>b-a);
    const cum=new Float64Array(N); let s=0;
    for(let i=0;i<N;i++){ s+=sorted[i]; cum[i]=s; }
    this.sorted=sorted; this.cum=cum; this.total=s;
    const cdf=new Float64Array(N); s=0;
    for(let i=0;i<N;i++){ s+=abs[i]; cdf[i]=s; }
    this.cdf=cdf;
    this.pts=this.samplePts(4500);
  }
  static fromQuant(meta, q, atoms){
    const lut=new Float32Array(256);
    const lr=Math.log(meta.vmax/meta.t0);
    for(let b=0;b<256;b++){
      const s=b-128;
      lut[b] = s===0?0: Math.sign(s)*meta.t0*Math.exp(Math.abs(s)/127*lr);

    const N=meta.n*meta.n*meta.n;
    const data=new Float32Array(N);
    for(let i=0;i<N;i++) data[i]=lut[q[i]];
    return new Field(meta, data, atoms);
  }

  isoForFrac(f){
    const t=f*this.total, c=this.cum;
    let lo=0, hi=c.length-1;

    const s=this.sorted; let lo=0, hi=s.length;
    while(lo<hi){ const m=(lo+hi)>>1; if(s[m]>=iso) lo=m+1; else hi=m; }
    return lo>0? this.cum[lo-1]/this.total : 0;
  }
  g2w(i){ return ((i+0.5)/this.n-0.5)*this.box; }
  w2g(x){ return (x/this.box+0.5)*this.n-0.5; }
  sample(x,y,z){
    const n=this.n;
    let gx=this.w2g(x), gy=this.w2g(y), gz=this.w2g(z);
    gx=clamp(gx,0,n-1.001); gy=clamp(gy,0,n-1.001); gz=clamp(gz,0,n-1.001);
    const i=gx|0, j=gy|0, k=gz|0, fx=gx-i, fy=gy-j, fz=gz-k;
    const d=this.data, s=n, s2=n*n;
    const b=i*s2+j*s+k;
    const c000=d[b], c100=d[b+s2], c010=d[b+s], c110=d[b+s2+s];
    const c001=d[b+1], c101=d[b+s2+1], c011=d[b+s+1], c111=d[b+s2+s+1];
    const c00=c000+(c100-c000)*fx, c10=c010+(c110-c010)*fx;
    const c01=c001+(c101-c001)*fx, c11=c011+(c111-c011)*fx;
    const c0=c00+(c10-c00)*fy, c1=c01+(c11-c01)*fy;
    return c0+(c1-c0)*fz;
  }
  grad(x,y,z,out){
    const h=this.box/this.n;
    out[0]=(this.sample(x+h,y,z)-this.sample(x-h,y,z))/(2*h);
    out[1]=(this.sample(x,y+h,z)-this.sample(x,y-h,z))/(2*h);
    out[2]=(this.sample(x,y,z+h)-this.sample(x,y,z-h))/(2*h);
    return out;
  }
  gradAbs(x,y,z,out){
    const h=this.box/this.n;
    out[0]=(Math.abs(this.sample(x+h,y,z))-Math.abs(this.sample(x-h,y,z)))/(2*h);
    out[1]=(Math.abs(this.sample(x,y+h,z))-Math.abs(this.sample(x,y-h,z)))/(2*h);
    out[2]=(Math.abs(this.sample(x,y,z+h))-Math.abs(this.sample(x,y,z-h)))/(2*h);
    return out;
  }
  samplePts(K){
    const n=this.n, cdf=this.cdf, tot=cdf[cdf.length-1];
    const P=new Float32Array(K*4);
    for(let p=0;p<K;p++){
      const r=Math.random()*tot;
      let lo=0, hi=cdf.length-1;
      while(lo<hi){ const m=(lo+hi)>>1; if(cdf[m]<r) lo=m+1; else hi=m; }
      const i=(lo/(n*n))|0, j=((lo/n)|0)%n, k=lo%n;
      P[p*4]  =this.g2w(i)+(Math.random()-0.5)*this.box/n;
      P[p*4+1]=this.g2w(j)+(Math.random()-0.5)*this.box/n;
      P[p*4+2]=this.g2w(k)+(Math.random()-0.5)*this.box/n;
      P[p*4+3]=(this.data[lo]>=0?1:-1)*(0.5+Math.random());
    }
    return P;
  }
}

const RAD={1:0.31,6:0.76,14:1.11};
function bondsOf(atoms){
  const B=[];
  for(let a=0;a<atoms.length;a++) for(let b=a+1;b<atoms.length;b++){
    const A=atoms[a], C=atoms[b];
    const dx=A[1]-C[1], dy=A[2]-C[2], dz=A[3]-C[3];
    const cut=((RAD[A[0]]||1.2)+(RAD[C[0]]||1.2))*1.18;
    if(dx*dx+dy*dy+dz*dz < cut*cut) B.push([a,b]);
  }
  return B;
}

const cam={yaw:-0.65, pitch:0.34, dist:23, rock: QS.get('rock')!=='0'};
let W=0,H=0,F=0;
function resize(){
  const r=cv.getBoundingClientRect();
  W=Math.max(300,r.width*DPR)|0; H=Math.max(240,r.height*DPR)|0;
  if(cv.width!==W||cv.height!==H){ cv.width=W; cv.height=H; }
  F=Math.min(W,H)*1.55;
}
let R={cy:1,sy:0,cp:1,sp:0};
function camFrame(t){
  const ry=cam.yaw+(cam.rock?0.36*Math.sin(t*3.1e-4):0);
  const rp=cam.pitch+(cam.rock?0.05*Math.sin(t*2.05e-4):0);
  R.cy=Math.cos(ry); R.sy=Math.sin(ry); R.cp=Math.cos(rp); R.sp=Math.sin(rp);
}
function proj(x,y,z,out){
  const x1=x*R.cy+z*R.sy, z1=-x*R.sy+z*R.cy;
  const y2=y*R.cp-z1*R.sp, z2=y*R.sp+z1*R.cp;
  const zc=z2+cam.dist, sc=F/zc;
  out.x=W/2+x1*sc; out.y=H/2-y2*sc; out.z=zc; out.s=sc;
  return out;
}
function rotN(nx,ny,nz,out){
  const x1=nx*R.cy+nz*R.sy, z1=-nx*R.sy+nz*R.cy;
  out[0]=x1; out[1]=ny*R.cp-z1*R.sp; out[2]=ny*R.sp+z1*R.cp;
  return out;
}

function ramp(t,stops){
  t=clamp(t,0,1)*(stops.length-1);
  const i=Math.min(stops.length-2, t|0), f=t-i;
  const a=stops[i], b=stops[i+1];
  return [a[0]+(b[0]-a[0])*f, a[1]+(b[1]-a[1])*f, a[2]+(b[2]-a[2])*f];
}
const POS_STOPS=[[10,12,16],[122,66,26],[245,162,94],[255,236,205]];
const NEG_STOPS=[[10,12,16],[34,64,132],[111,166,255],[214,232,255]];
const TERRAIN=[[16,22,44],[26,74,102],[92,134,110],[196,168,120],[236,226,208],[252,250,246]];
function divRGB(v,w,vmax){
  const t=Math.asinh(v/w)/Math.asinh(vmax/w);
  return t>=0? ramp(t,POS_STOPS) : ramp(-t,NEG_STOPS);
}

const MS_TBL=[[],[[3,0]],[[0,1]],[[3,1]],[[1,2]],[[3,2],[0,1]],[[0,2]],[[3,2]],[[2,3]],[[2,0]],[[0,3],[1,2]],[[1,2]],[[1,3]],[[0,1]],[[3,0]],[]];
function msq(get,n,L,segs){
  for(let i=0;i<n-1;i++) for(let j=0;j<n-1;j++){
    const v0=get(i,j), v1=get(i+1,j), v2=get(i+1,j+1), v3=get(i,j+1);
    let c=0;
    if(v0>L)c|=1; if(v1>L)c|=2; if(v2>L)c|=4; if(v3>L)c|=8;
    if(c===0||c===15) continue;
    const ep=(e)=>{
      switch(e){
        case 0:{ const t=(L-v0)/(v1-v0); return [i+t, j]; }
        case 1:{ const t=(L-v1)/(v2-v1); return [i+1, j+t]; }
        case 2:{ const t=(L-v3)/(v2-v3); return [i+t, j+1]; }
        default:{ const t=(L-v0)/(v3-v0); return [i, j+t]; }
      }
    };
    for(const pr of MS_TBL[c]) segs.push([ep(pr[0]), ep(pr[1])]);
  }
  return segs;
}

<script>
"use strict";
const FIELDS={};
let BONDS=[];
const S={view:null, frac:0.72, iso:0, fieldKey:'hse', splats:null, nodeSplats:null};
const curF=()=>FIELDS[S.fieldKey];
const P1={x:0,y:0,z:0,s:0}, P2={x:0,y:0,z:0,s:0}, NV=[0,0,0], GV=[0,0,0];
const MAXS=30000;
const floorY=f=>-f.box*0.60;

function extractSurface(f, iso, mode){
  const n=f.n, d=f.data, out=[];
  const eps=Math.max((f.meta.t0||f.vmax*2e-4)*8, f.vmax*0.002);
  for(let i=0;i<n-1;i++) for(let j=0;j<n-1;j++){
    let idx=(i*n+j)*n;
    for(let k=0;k<n-1;k++,idx++){
      const raw=d[idx];
      const a = mode==='abs'? Math.abs(raw) : raw;
      const L = mode==='abs'? iso : 0;
      for(let dir=0;dir<3;dir++){
        const nb = dir===0? d[idx+n*n] : dir===1? d[idx+n] : d[idx+1];
        const b = mode==='abs'? Math.abs(nb) : nb;
        if((a-L)*(b-L)>=0) continue;
        if(mode==='zero' && Math.max(Math.abs(raw),Math.abs(nb))<eps) continue;
        const t=(L-a)/(b-a);
        const x=f.g2w(i)+(dir===0?t*f.box/n:0);
        const y=f.g2w(j)+(dir===1?t*f.box/n:0);
        const z=f.g2w(k)+(dir===2?t*f.box/n:0);
        if(mode==='abs') f.gradAbs(x,y,z,GV); else f.grad(x,y,z,GV);
        const gl=Math.hypot(GV[0],GV[1],GV[2])||1;
        out.push(x,y,z, GV[0]/gl,GV[1]/gl,GV[2]/gl, raw>=0?1:-1);
      }
    }
  }
  let m=out.length/7;
  if(m<=MAXS) return new Float32Array(out);
  const st=Math.ceil(m/MAXS), res=new Float32Array(Math.ceil(m/st)*7);
  let w=0;
  for(let p=0;p<m;p+=st){ for(let q=0;q<7;q++) res[w*7+q]=out[p*7+q]; w++; }
  return res.subarray(0,w*7);
}

function clearBG(){ ctx.fillStyle='#0b0e14'; ctx.fillRect(0,0,W,H); }
function drawFloor(f){
  const y=floorY(f);
  ctx.strokeStyle='rgba(120,132,152,0.10)'; ctx.lineWidth=1;
  for(let v=-6;v<=6;v+=2){
    proj(v,y,-6,P1); proj(v,y,6,P2);
    ctx.beginPath(); ctx.moveTo(P1.x,P1.y); ctx.lineTo(P2.x,P2.y); ctx.stroke();
    proj(-6,y,v,P1); proj(6,y,v,P2);
    ctx.beginPath(); ctx.moveTo(P1.x,P1.y); ctx.lineTo(P2.x,P2.y); ctx.stroke();
  }
}
const ACOL={14:'127,138,160', 6:'255,209,102', 1:'232,237,245'};
const ARAD={14:0.13, 6:0.24, 1:0.12};
function drawSkeleton(f, alpha){
  const A=f.atoms, ap=[];
  for(let i=0;i<A.length;i++){ const o={x:0,y:0,z:0,s:0}; proj(A[i][1],A[i][2],A[i][3],o); ap.push(o); }
  ctx.lineWidth=1.1*DPR;
  for(const b of BONDS){
    const heavy=(A[b[0]][0]!==14)||(A[b[1]][0]!==14);
    ctx.strokeStyle=heavy?`rgba(255,209,102,${0.55*alpha})`:`rgba(120,132,152,${0.30*alpha})`;
    ctx.beginPath(); ctx.moveTo(ap[b[0]].x,ap[b[0]].y); ctx.lineTo(ap[b[1]].x,ap[b[1]].y); ctx.stroke();
  }
  for(let i=0;i<A.length;i++){
    const Z=A[i][0], p=ap[i];
    const r=Math.max(1.5*DPR,(ARAD[Z]||0.2)*p.s);
    ctx.fillStyle=`rgba(${ACOL[Z]||'150,150,150'},${(Z===14?0.75:0.95)*alpha})`;
    ctx.beginPath(); ctx.arc(p.x,p.y,r,0,6.29); ctx.fill();
  }
}
function makeSprite(rgb,a){
  const c=document.createElement('canvas'); c.width=c.height=64;
  const g=c.getContext('2d');
  const gr=g.createRadialGradient(32,32,0,32,32,32);
  gr.addColorStop(0,`rgba(${rgb},${a})`); gr.addColorStop(1,`rgba(${rgb},0)`);
  g.fillStyle=gr; g.fillRect(0,0,64,64);
  return c;
}
const SPR_POS=makeSprite('245,162,94',0.06), SPR_NEG=makeSprite('111,166,255',0.06);

function sortByDepth(count, keyAt){
  const idx=new Array(count);
  for(let i=0;i<count;i++) idx[i]=i;
  idx.sort((a,b)=>keyAt(b)-keyAt(a));
  return idx;
}

function drawSplats(splats, t, colorFn){
  const m=splats.length/7;
  const zs=new Float32Array(m), xs=new Float32Array(m), ys=new Float32Array(m), ss=new Float32Array(m);
  for(let p=0;p<m;p++){
    proj(splats[p*7],splats[p*7+1],splats[p*7+2],P1);
    xs[p]=P1.x; ys[p]=P1.y; zs[p]=P1.z; ss[p]=P1.s;
  }
  const order=sortByDepth(m, i=>zs[i]);
  const Lx=-0.42,Ly=0.58,Lz=0.70;
  for(const p of order){
    rotN(splats[p*7+3],splats[p*7+4],splats[p*7+5],NV);
    const d=Math.abs(NV[0]*Lx+NV[1]*Ly+NV[2]*Lz);
    const shade=0.28+0.72*d;
    const r=clamp(0.105*ss[p],1.6*DPR,7*DPR);
    ctx.fillStyle=colorFn(splats[p*7+6], shade, p);
    ctx.fillRect(xs[p]-r, ys[p]-r, 2*r, 2*r);
  }
}

const VIEW_FN={};

VIEW_FN.fog=(t)=>{
  const f=curF(); clearBG();
  drawSkeleton(f,0.9);
  ctx.globalCompositeOperation='lighter';
  const P=f.pts;
  for(let i=0;i<P.length;i+=4){
    proj(P[i],P[i+1],P[i+2],P1);
    const r=0.5*P1.s;
    ctx.drawImage(P[i+3]>0?SPR_POS:SPR_NEG, P1.x-r, P1.y-r, 2*r, 2*r);
  }
  ctx.globalCompositeOperation='source-over';
};

VIEW_FN.swarm=(t)=>{
  const f=curF(); clearBG();
  drawFloor(f); drawSkeleton(f,1);
  const P=f.pts, m=P.length/4;
  const zs=new Float32Array(m), xs=new Float32Array(m), ys=new Float32Array(m), ss=new Float32Array(m);
  for(let i=0;i<m;i++){ proj(P[i*4],P[i*4+1],P[i*4+2],P1); xs[i]=P1.x; ys[i]=P1.y; zs[i]=P1.z; ss[i]=P1.s; }
  const order=sortByDepth(m,i=>zs[i]);
  for(const i of order){
    const sg=P[i*4+3];
    const tw=0.62+0.38*Math.sin(t*0.003+i*2.4);
    const a=tw*clamp(1.95-zs[i]/cam.dist,0.22,1);
    ctx.fillStyle=sg>0?`rgba(245,162,94,${a.toFixed(3)})`:`rgba(111,166,255,${a.toFixed(3)})`;
    const r=clamp(0.055*ss[i],1.2*DPR,3.2*DPR);
    ctx.fillRect(xs[i]-r,ys[i]-r,2*r,2*r);
  }
};

VIEW_FN.sea=(t)=>{
  const f=curF();
  if(!S.splats) S.splats=extractSurface(f,S.iso,'abs');
  clearBG(); drawFloor(f);
  const fy=floorY(f), m=S.splats.length/7;
  ctx.fillStyle='rgba(0,0,0,0.35)';
  for(let p=0;p<m;p+=7){
    proj(S.splats[p*7],fy,S.splats[p*7+2],P1);
    ctx.beginPath(); ctx.ellipse(P1.x,P1.y,0.16*P1.s,0.06*P1.s,0,0,6.29); ctx.fill();
  }
  drawSkeleton(f,0.85);
  drawSplats(S.splats,t,(sg,shade)=>{
    return sg>0
      ? `rgb(${(245*shade)|0},${(162*shade)|0},${(94*shade)|0})`
      : `rgb(${(111*shade)|0},${(166*shade)|0},${(255*shade)|0})`;
  });
};

VIEW_FN.nodes=(t)=>{
  const f=curF();
  if(!S.nodeSplats) S.nodeSplats=extractSurface(f,0,'zero');
  clearBG();
  drawSkeleton(f,0.95);
  const P=f.pts;
  for(let i=0;i<P.length;i+=16){
    proj(P[i],P[i+1],P[i+2],P1);
    ctx.fillStyle=P[i+3]>0?'rgba(245,162,94,0.20)':'rgba(111,166,255,0.20)';
    ctx.fillRect(P1.x-1*DPR,P1.y-1*DPR,2*DPR,2*DPR);
  }
  drawSplats(S.nodeSplats,t,(sg,shade)=>`rgb(${(168*shade)|0},${(216*shade)|0},${(190*shade)|0})`);

const RAIN={list:null};
function rainSpawn(f,w){
  w.x=(Math.random()-0.5)*f.box*0.92;
  w.y=(Math.random()-0.5)*f.box*0.92;
  w.z=(Math.random()-0.5)*f.box*0.92;
  w.hist=[]; w.state=0; w.doneT=0; w.cls=-1;
}
VIEW_FN.rain=(t)=>{
  const f=curF();
  if(!RAIN.list){ RAIN.list=[]; for(let i=0;i<620;i++){ const w={}; rainSpawn(f,w); RAIN.list.push(w); } }
  clearBG(); drawFloor(f); drawSkeleton(f,1);
  const A=f.atoms;
  for(const w of RAIN.list){
    if(w.state===0){
      for(let s=0;s<2;s++){
        f.gradAbs(w.x,w.y,w.z,GV);
        const gl=Math.hypot(GV[0],GV[1],GV[2]);
        const val=Math.abs(f.sample(w.x,w.y,w.z));
        if(val>0.42*f.vmax || (gl<f.vmax*0.02 && val>f.vmax*0.01) || (gl<f.vmax*0.002)){
          w.state=1; w.doneT=t;
          let best=1e9,bi=-1;
          for(let ai=0;ai<A.length;ai++){
            const dx=A[ai][1]-w.x, dy=A[ai][2]-w.y, dz=A[ai][3]-w.z;
            const dd=dx*dx+dy*dy+dz*dz;
            if(dd<best){best=dd;bi=ai;}
          }
          w.cls=bi;
          break;
        }
        w.x+=GV[0]/gl*0.055; w.y+=GV[1]/gl*0.055; w.z+=GV[2]/gl*0.055;
        w.hist.push(w.x,w.y,w.z);
        if(w.hist.length>141) w.hist.splice(0,3);
      }
    } else if(t-w.doneT>1300){ rainSpawn(f,w); continue; }
    const hlen=w.hist.length/3;
    if(hlen<2) continue;
    let col='109,138,178', alpha=0.5;
    if(w.state===1){
      const Z=A[w.cls]?A[w.cls][0]:14;
      col = Z===6?'255,209,102' : Z===1?'232,237,245' : '127,138,160';
      alpha = 0.85*Math.max(0,1-(t-w.doneT)/1300);
    }
    ctx.strokeStyle=`rgba(${col},${alpha.toFixed(3)})`;
    ctx.lineWidth=1.1*DPR;
    ctx.beginPath();
    for(let hh=0;hh<hlen;hh++){
      proj(w.hist[hh*3],w.hist[hh*3+1],w.hist[hh*3+2],P1);
      if(hh===0) ctx.moveTo(P1.x,P1.y); else ctx.lineTo(P1.x,P1.y);
    }
    ctx.stroke();
    proj(w.x,w.y,w.z,P1);
    ctx.fillStyle=`rgba(${col},${Math.min(1,alpha+0.2).toFixed(3)})`;
    ctx.fillRect(P1.x-1.4*DPR,P1.y-1.4*DPR,2.8*DPR,2.8*DPR);
  }
};

const SWEEP={segs:[], lastK:-1};
VIEW_FN.sweep=(t)=>{
  const f=curF(), n=f.n;
  const zw=0.46*f.box*Math.sin(t*4.2e-4);
  const k=clamp(Math.round(f.w2g(zw)),1,n-2);
  if(k!==SWEEP.lastK){
    SWEEP.lastK=k;
    const d=f.data;
    const get=(i,j)=>d[(i*n+j)*n+k];
    for(const L of [S.iso,-S.iso]){
      const segs=[];
      msq(get,n,L,segs);
      const zp=f.g2w(k);
      for(const sg of segs){
        SWEEP.segs.push({ax:f.g2w(sg[0][0]),ay:f.g2w(sg[0][1]),bx:f.g2w(sg[1][0]),by:f.g2w(sg[1][1]),z:zp,s:L>=0?1:-1,born:t});
      }
    }
    if(SWEEP.segs.length>9000) SWEEP.segs.splice(0,SWEEP.segs.length-9000);
  }
  SWEEP.segs=SWEEP.segs.filter(sg=>t-sg.born<2600);
  clearBG(); drawSkeleton(f,0.7);
  const hb=f.box*0.49;
  ctx.strokeStyle='rgba(220,230,245,0.13)'; ctx.lineWidth=1*DPR;
  ctx.beginPath();
  proj(-hb,-hb,zw,P1); ctx.moveTo(P1.x,P1.y);
  proj(hb,-hb,zw,P1); ctx.lineTo(P1.x,P1.y);
  proj(hb,hb,zw,P1); ctx.lineTo(P1.x,P1.y);
  proj(-hb,hb,zw,P1); ctx.lineTo(P1.x,P1.y);
  ctx.closePath(); ctx.stroke();
  ctx.lineWidth=1.3*DPR;
  for(const sg of SWEEP.segs){
    const a=Math.exp(-(t-sg.born)/950);
    ctx.strokeStyle=sg.s>0?`rgba(125,240,168,${(0.9*a).toFixed(3)})`:`rgba(111,166,255,${(0.9*a).toFixed(3)})`;
    proj(sg.ax,sg.ay,sg.z,P1); proj(sg.bx,sg.by,sg.z,P2);
    ctx.beginPath(); ctx.moveTo(P1.x,P1.y); ctx.lineTo(P2.x,P2.y); ctx.stroke();
  }
};

<script>
"use strict";
function rect2D(){

}

  ctx.strokeRect(r.x0,r.y0,r.S,r.S);
}
function scaleBar(r,box){
  const px=2/box*r.S;
  const y=r.y0+r.S-14*DPR, x=r.x0+12*DPR;
  ctx.strokeStyle='rgba(200,210,225,0.8)'; ctx.lineWidth=2*DPR;
  ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x+px,y); ctx.stroke();
  ctx.fillStyle='rgba(160,170,185,0.9)'; ctx.font=`${11*DPR}px ui-monospace,Menlo,monospace`;
  ctx.textAlign='left'; ctx.fillText('2 Å', x+px+6*DPR, y+4*DPR);
}
function hudText(txt){
  ctx.fillStyle='rgba(200,210,225,0.85)'; ctx.font=`${12*DPR}px ui-monospace,Menlo,monospace`;
  ctx.textAlign='right'; ctx.fillText(txt, W-14*DPR, 24*DPR); ctx.textAlign='left';
}

const SL={k:36, wKey:'valence', mode:'field', os:null, stale:true, sound:[]};
const wOf=f=>({core:f.vmax/2, valence:f.vmax/40, tails:f.vmax/600})[SL.wKey];
VIEW_FN.slices=(t)=>{
  const f=curF(), n=f.n, d=f.data;
  if(!SL.os||SL.os.width!==n){ SL.os=document.createElement('canvas'); SL.os.width=SL.os.height=n; SL.stale=true; }
  SL.k=clamp(SL.k,0,n-1);
  if(SL.stale){
    const g=SL.os.getContext('2d'), img=g.createImageData(n,n), w=wOf(f);
    const fp=FIELDS.hse, fq=FIELDS.pbe;
    const comp=SL.mode==='comp'&&fp&&fq&&fp.n===n&&fq.n===n;
    for(let j=0;j<n;j++) for(let i=0;i<n;i++){
      const o=((n-1-j)*n+i)*4;
      if(comp){
        const v1=Math.abs(fp.data[(i*n+j)*n+SL.k]), v2=Math.abs(fq.data[(i*n+j)*n+SL.k]);
        const t1=clamp(Math.asinh(v1/(fp.vmax/40))/Math.asinh(40),0,1);
        const t2=clamp(Math.asinh(v2/(fq.vmax/40))/Math.asinh(40),0,1);
        img.data[o]=(t1*255)|0; img.data[o+1]=(t2*215)|0; img.data[o+2]=(t2*255)|0; img.data[o+3]=255;
      } else {
        const c=divRGB(d[(i*n+j)*n+SL.k],w,f.vmax);
        img.data[o]=c[0]; img.data[o+1]=c[1]; img.data[o+2]=c[2]; img.data[o+3]=255;
      }
    }
    g.putImageData(img,0,0); SL.stale=false;
  }
  clearBG();
  const r=rect2D();
  ctx.imageSmoothingEnabled=true;
  ctx.drawImage(SL.os,r.x0,r.y0,r.S,r.S);
  frameRect(r);
  const mapx=gi=>r.x0+((gi+0.5)/n)*r.S;
  const mapy=gj=>r.y0+r.S-((gj+0.5)/n)*r.S;
  if(SL.mode!=='comp'){
    const get=(i,j)=>d[(i*n+j)*n+SL.k];
    for(const L of [S.iso,-S.iso]){
      const segs=[]; msq(get,n,L,segs);
      ctx.strokeStyle=L>=0?'rgba(255,220,180,0.75)':'rgba(160,200,255,0.75)';
      ctx.lineWidth=1.1*DPR;
      ctx.beginPath();
      for(const sg of segs){ ctx.moveTo(mapx(sg[0][0]),mapy(sg[0][1])); ctx.lineTo(mapx(sg[1][0]),mapy(sg[1][1])); }
      ctx.stroke();
    }
  }
  const zw=f.g2w(SL.k);
  const A=f.atoms;
  ctx.font=`${11*DPR}px ui-monospace,Menlo,monospace`;
  for(let ai=0;ai<A.length;ai++){
    if(A[ai][0]===14) continue;
    if(Math.abs(A[ai][3]-zw)>1.2) continue;
    const px=mapx(f.w2g(A[ai][1])), py=mapy(f.w2g(A[ai][2]));
    ctx.strokeStyle='rgba(255,209,102,0.9)'; ctx.lineWidth=1.3*DPR;
    ctx.beginPath(); ctx.arc(px,py,5*DPR,0,6.29); ctx.stroke();
    ctx.fillStyle='rgba(255,209,102,0.9)';
    ctx.fillText(A[ai][0]===6?'C':'H', px+7*DPR, py-6*DPR);
  }
  ctx.font=`${11.5*DPR}px ui-monospace,Menlo,monospace`;
  for(const sn of SL.sound){
    if(sn.k!==SL.k) continue;
    const px=mapx(sn.i), py=mapy(sn.j);
    ctx.fillStyle='#fff';
    ctx.fillRect(px-1.6*DPR,py-1.6*DPR,3.2*DPR,3.2*DPR);
    ctx.fillStyle='rgba(240,245,252,0.95)';
    ctx.fillText(fmtE(sn.v), px+6*DPR, py-5*DPR);
  }
  scaleBar(r,f.box);
  hudText(`z = ${zw>=0?'+':''}${zw.toFixed(2)} Å · slice ${SL.k+1}/${n} · scroll to cine`);
};

function colY(f){
  if(f._colY) return f._colY;
  const n=f.n, d=f.data, c=new Float32Array(n*n);
  for(let i=0;i<n;i++) for(let k=0;k<n;k++){
    let s=0;
    for(let j=0;j<n;j++) s+=Math.abs(d[(i*n+j)*n+k]);
    c[i*n+k]=s;
  }
  f._colY=c; return c;
}
const SH={mode:'shadow', cache:{}};
VIEW_FN.shadow=(t)=>{
  const f=curF(), n=f.n;
  const key=S.fieldKey+':'+SH.mode+':'+n;
  if(!SH.cache[key]){
    const I=colY(f);
    const os=document.createElement('canvas'); os.width=os.height=n;
    const g=os.getContext('2d'), img=g.createImageData(n,n);
    const val=new Float32Array(n*n);
    let ss=0, cnt=0;
    for(let i=1;i<n-1;i++) for(let k=1;k<n-1;k++){
      let v;
      if(SH.mode==='shadow') v=I[(i+1)*n+k]+I[(i-1)*n+k]+I[i*n+k+1]+I[i*n+k-1]-4*I[i*n+k];
      else if(SH.mode==='knife') v=(I[(i+1)*n+k]-I[(i-1)*n+k])*0.5;
      else v=I[i*n+k];
      val[i*n+k]=v; ss+=v*v; cnt++;
    }
    const rms=Math.sqrt(ss/cnt)||1;
    let imax=0; for(let q=0;q<n*n;q++) imax=Math.max(imax,val[q]);
    for(let k=0;k<n;k++) for(let i=0;i<n;i++){
      const o=((n-1-k)*n+i)*4;
      const v=val[i*n+k];
      let rr,gg,bb;
      if(SH.mode==='shadow'){
        const gray=clamp(0.5+v/(6*rms),0.02,0.98)*255;
        rr=gg=gray; bb=gray*1.04;
      } else if(SH.mode==='knife'){
        const tt=clamp(v/(3.5*rms),-1,1);
        rr=128+115*tt; gg=128+34*tt; bb=128-115*tt;
      } else {
        const tt=clamp(Math.asinh(v/(imax/40))/Math.asinh(40),0,1);
        rr=gg=tt*235; bb=tt*255;
      }
      img.data[o]=rr; img.data[o+1]=gg; img.data[o+2]=bb; img.data[o+3]=255;
    }
    g.putImageData(img,0,0);
    SH.cache[key]=os;
  }
  clearBG();
  const r=rect2D();
  ctx.imageSmoothingEnabled=true;
  ctx.drawImage(SH.cache[key],r.x0,r.y0,r.S,r.S);
  frameRect(r); scaleBar(r,f.box);
  hudText(SH.mode==='shadow'?'side view · ∇²∫|σ|dy':SH.mode==='knife'?'side view · knife-edge ∂x∫|σ|dy':'side view · ∫|σ|dy');
};

const TP={iso:-1, key:'', os:null, h:null, colmax:null};
VIEW_FN.topo=(t)=>{
  const f=curF(), n=f.n, d=f.data;
  if(TP.iso!==S.iso||TP.key!==S.fieldKey||!TP.os){
    TP.iso=S.iso; TP.key=S.fieldKey;
    const h=new Int16Array(n*n).fill(-1), cm=new Float32Array(n*n);
    for(let i=0;i<n;i++) for(let j=0;j<n;j++){
      let best=0, hit=-1;
      for(let k=n-1;k>=0;k--){
        const v=Math.abs(d[(i*n+j)*n+k]);
        if(v>best) best=v;
        if(hit<0&&v>=S.iso) hit=k;
      }
      h[i*n+j]=hit; cm[i*n+j]=best;
    }
    TP.h=h; TP.colmax=cm;
    const os=document.createElement('canvas'); os.width=os.height=n;
    const g=os.getContext('2d'), img=g.createImageData(n,n);
    const hv=(i,j)=>Math.max(0,h[clamp(i,0,n-1)*n+clamp(j,0,n-1)]);
    const Ll=[-0.55,0.5,0.68], Ln=Math.hypot(...Ll);
    for(let j=0;j<n;j++) for(let i=0;i<n;i++){
      const o=((n-1-j)*n+i)*4;
      const hh=h[i*n+j];
      if(hh<0){ img.data[o]=13; img.data[o+1]=16; img.data[o+2]=24; img.data[o+3]=255; continue; }
      const gx=(hv(i+1,j)-hv(i-1,j))*0.5, gy=(hv(i,j+1)-hv(i,j-1))*0.5;
      let nx=-gx, ny=-gy, nz=2.4;
      const nl=Math.hypot(nx,ny,nz); nx/=nl; ny/=nl; nz/=nl;
      const diff=clamp((nx*Ll[0]+ny*Ll[1]+nz*Ll[2])/Ln,0,1);
      let c=ramp(hh/(n-1),TERRAIN);
      let m=0.30+0.70*diff;
      if((hv(i,j)/4|0)!==(hv(i+1,j)/4|0)||(hv(i,j)/4|0)!==(hv(i,j+1)/4|0)) m*=0.45;
      img.data[o]=c[0]*m; img.data[o+1]=c[1]*m; img.data[o+2]=c[2]*m; img.data[o+3]=255;
    }
    g.putImageData(img,0,0); TP.os=os;
  }
  clearBG();
  const r=rect2D();
  ctx.imageSmoothingEnabled=true;
  ctx.drawImage(TP.os,r.x0,r.y0,r.S,r.S);
  frameRect(r);
  const mapx=gi=>r.x0+((gi+0.5)/n)*r.S;
  const mapy=gj=>r.y0+r.S-((gj+0.5)/n)*r.S;
  ctx.font=`${11*DPR}px ui-monospace,Menlo,monospace`;
  const A=f.atoms;
  for(let ai=0;ai<A.length;ai++){
    if(A[ai][0]===14) continue;
    const px=mapx(f.w2g(A[ai][1])), py=mapy(f.w2g(A[ai][2]));
    ctx.strokeStyle='rgba(20,24,34,0.9)'; ctx.lineWidth=2.5*DPR;
    ctx.beginPath(); ctx.arc(px,py,4.5*DPR,0,6.29); ctx.stroke();
    ctx.strokeStyle='rgba(255,209,102,0.95)'; ctx.lineWidth=1.2*DPR;
    ctx.beginPath(); ctx.arc(px,py,4.5*DPR,0,6.29); ctx.stroke();
    ctx.fillStyle='rgba(255,230,170,0.95)';
    ctx.fillText(A[ai][0]===6?'C':'H', px+7*DPR, py-6*DPR);
  }
  scaleBar(r,f.box);
  hudText('top view · envelope height at sea level · NOT Tersoff–Hamann');
};

const AUD={on:false, actx:null, next:0, rate:0};
function audioClick(){
  const a=AUD.actx, t0=a.currentTime;
  const o=a.createOscillator(), g=a.createGain();
  o.type='square'; o.frequency.value=1350+Math.random()*500;
  g.gain.setValueAtTime(0.06,t0);
  g.gain.exponentialRampToValueAtTime(0.0004,t0+0.010);
  o.connect(g); g.connect(a.destination);
  o.start(t0); o.stop(t0+0.014);
}
function audioTick(t){
  if(!AUD.on||AUD.rate<=0) return;
  const now=performance.now();
  if(now>=AUD.next){ audioClick(); AUD.next=now+1000/AUD.rate; }
}
function setProbe(vabs,vmax){
  if(vabs<=0){ AUD.rate=0; return; }
  const nrm=clamp(Math.asinh(vabs/(vmax/300))/Math.asinh(300),0,1);
  AUD.rate=1.5+58*nrm;
}
</script>
<script>
"use strict";
const VIEWS=[
 {id:'fog',   nm:'Fog',        sub:'raymarch baseline', is3d:1, cap:'<b>The baseline we already had.</b> Additive blending sums everything along each ray: occlusion and shading — the two strongest depth cues — are destroyed, and opposite signs mix to mud. Orange = majority spin, blue = minority.'},
 {id:'swarm', nm:'Swarm',      sub:'pointillism · dot maps', is3d:1, cap:'<b>Dot-density cartography / pointillism.</b> 4,500 Monte-Carlo samples of |σ(r)| — the swarm <i>is</i> the probability cloud, and samples of a distribution are arguably the honest picture. Discrete points bring back occlusion, parallax, sparkle. Drag it.'},
 {id:'sea',   nm:'Sea level',  sub:'coastline + enclosed %', is3d:1, cap:'<b>Cartography: the isosurface as coastline.</b> The slider is sea level; the readout is the fraction of ∫|σ| the coast encloses — the 26-year-old CCL isosurface question, answered live, on the figure, by default.'},
 {id:'nodes', nm:'Nodes',      sub:'Chladni sand', is3d:1, cap:'<b>Chladni: sand collects where nothing moves.</b> The pale sheet is σ(r) = 0 — where spin polarization flips sign (faint dots give the two phases for context). Fog can never show this surface, and it is exactly where bonding/antibonding distinctions live.'},
 {id:'rain',  nm:'Rain',       sub:'watersheds · QTAIM', is3d:1, cap:'<b>Watersheds.</b> Tracers climb ∇|σ| and drain into basins: trails are gradient paths, endpoints color by the capturing atom (gold = C, white = H, gray = Si). The field grows its own skeleton — the ball-and-stick convention becomes optional.'},
 {id:'slices',nm:'Slices',     sub:'radiology · cine-scroll', is3d:0, cap:'<b>Radiology + nautical charts.</b> Scroll to cine through z under a chosen contrast window; contours mark ±sea-level; <b>click to pin a sounding</b> — a printed number, the most honest mark on any figure. Composite = astronomy false-color: HSE (warm) vs PBE (cool), gray where they agree, fringes where they differ.'},
 {id:'sweep', nm:'Sweep',      sub:'radar phosphor', is3d:1, cap:'<b>Radar phosphor.</b> A scan plane sweeps the cell; ±sea-level contours persist and decay like a CRT trace. Slice honesty plus motion — the eye integrates the sweep into a 3D model it never gets from fog.'},
 {id:'shadow',nm:'Shadowgraph',sub:'schlieren · 1665', is3d:0, cap:'<b>Hooke’s candle, 1665.</b> You never see air density — you see light bent by it. Side-on: shadowgraph ≈ ∇² of the column density (for electron densities the Laplacian is the QTAIM-meaningful field); knife-edge is the signed gradient.'},
 {id:'topo',  nm:'Topograph',  sub:'instrument · minimap', is3d:0, cap:'<b>The instrument view.</b> Height of the |σ| = sea-level envelope, hillshaded like a terrain map, contour-lined every 4 voxels. <b>Illustrative only — not Tersoff–Hamann current.</b> Also the obvious orientation minimap for every 3D view.'}
];
const IS3D=Object.fromEntries(VIEWS.map(v=>[v.id,v.is3d]));

function toast(msg){
  const el=$('toast'); el.textContent=msg; el.style.display='block';
  clearTimeout(toast._t); toast._t=setTimeout(()=>el.style.display='none',6000);
}
function invalidate(all){
  S.splats=null; TP.iso=-1; SWEEP.lastK=-1;
  if(all){ S.nodeSplats=null; SL.stale=true; SL.sound=[]; RAIN.list=null; SWEEP.segs=[]; SH.cache={}; TP.key=''; }
}
function identity(){
  const f=curF(), m=f.meta;
  let txt=`<b>${m.src}</b> · ${m.method} · box ${f.box.toFixed(2)} Å · max|σ| = ${fmtE(f.vmax)} a.u.`;
  if(m.grid_src) txt+=`<br>${m.grid_src[0]}³ → ${m.n}³ mean-pool · 8-bit log quant (floor 2×10⁻⁴·max) · recentered on |σ|max · Si₆₃C₂H₁`;
  else txt+=`<br>${m.n}³ · float · ${f.atoms.length} atoms · dropped file — no quantization`;
  $('identity').innerHTML=txt;
}
function readout(){
  const f=curF();
  const actual=f.fracForIso(S.iso);
  $('isoRead').innerHTML=`|σ| = ${fmtE(S.iso)} a.u.<br>encloses ${(actual*100).toFixed(actual>0.99?2:1)}% of ∫|σ|`;
}
function setIsoFromFrac(){
  S.iso=curF().isoForFrac(S.frac);
  invalidate(false); readout();
}
function setField(key){
  S.fieldKey=key;
  invalidate(true); setIsoFromFrac(); identity();
}
function setView(id){
  S.view=id; AUD.rate=0;
  document.querySelectorAll('.viewbtn').forEach(b=>b.classList.toggle('act',b.dataset.v===id));
  $('caption').innerHTML=VIEWS.find(v=>v.id===id).cap;
  cv.style.cursor=IS3D[id]?'grab':'crosshair';
  buildHud(id);
}
function hbtn(label,on,fn){
  const b=document.createElement('button');
  b.className='tb'+(on?' on':''); b.textContent=label;
  b.onclick=fn; return b;
}
function buildHud(id){
  const h=$('hud'); h.innerHTML='';
  if(id==='slices'){
    for(const wk of ['core','valence','tails'])
      h.appendChild(hbtn(wk, SL.wKey===wk, ()=>{SL.wKey=wk; SL.mode='field'; SL.stale=true; buildHud(id);}));
    h.appendChild(hbtn('HSE vs PBE', SL.mode==='comp', ()=>{SL.mode=SL.mode==='comp'?'field':'comp'; SL.stale=true; buildHud(id);}));
    h.appendChild(hbtn('clear pins', false, ()=>{SL.sound=[];}));
  }
  if(id==='shadow'){
    for(const md of [['shadow','shadowgraph'],['knife','knife-edge'],['column','plain column']])
      h.appendChild(hbtn(md[1], SH.mode===md[0], ()=>{SH.mode=md[0]; buildHud(id);}));
  }
}
function buildUI(){
  const nav=$('nav');
  for(const v of VIEWS){
    const b=document.createElement('button');
    b.className='viewbtn'; b.dataset.v=v.id;
    b.innerHTML=`<span class="nm">${v.nm}</span><span class="sub">${v.sub}</span>`;
    b.onclick=()=>setView(v.id);
    nav.appendChild(b);
  }
  const g=document.createElement('div'); g.id='gctl';
  g.innerHTML=`
    <label>sea level (enclosed fraction)<input type="range" id="frac" min="0" max="1000" value="110"></label>
    <div id="isoRead"></div>
    <div class="row" style="margin-top:8px">
      <select class="tb" id="fieldSel"><option value="hse">HSE</option><option value="pbe">PBE</option></select>
      <button class="tb on" id="rockB">rock</button>
      <button class="tb" id="audB">probe ♪</button>
    </div>
    <div style="font-size:11px;color:var(--dim);margin-top:6px">drag = rotate · wheel = zoom / cine · drop any .cube on the page · probe ♪ ticks like a Geiger counter under the cursor in Slices &amp; Topograph</div>`;
  nav.appendChild(g);
  $('frac').addEventListener('input',e=>{
    const s=e.target.value/1000;
    S.frac=1-Math.pow(10,-(0.25+2.75*s));
    setIsoFromFrac();
  });
  $('fieldSel').addEventListener('change',e=>setField(e.target.value));
  $('rockB').addEventListener('click',()=>{ cam.rock=!cam.rock; $('rockB').classList.toggle('on',cam.rock); });
  $('audB').addEventListener('click',()=>{
    AUD.on=!AUD.on;
    if(AUD.on&&!AUD.actx){ AUD.actx=new (window.AudioContext||window.webkitAudioContext)(); }
    if(AUD.on) AUD.actx.resume();
    $('audB').classList.toggle('on',AUD.on);
  });
}

let dragging=null;
cv.addEventListener('pointerdown',e=>{
  if(IS3D[S.view]){ dragging={x:e.clientX,y:e.clientY}; cv.setPointerCapture(e.pointerId); cv.style.cursor='grabbing'; }
});
cv.addEventListener('pointermove',e=>{
  if(dragging){
    cam.yaw+=(e.clientX-dragging.x)*0.006;
    cam.pitch=clamp(cam.pitch+(e.clientY-dragging.y)*0.0035,-0.8,1.15);
    dragging.x=e.clientX; dragging.y=e.clientY;
    return;
  }
  if(S.view==='slices'||S.view==='topo'){
    const f=curF(), n=f.n, r=rect2D();
    const bb=cv.getBoundingClientRect();
    const px=(e.clientX-bb.left)*DPR, py=(e.clientY-bb.top)*DPR;
    const i=Math.floor((px-r.x0)/r.S*n), j=n-1-Math.floor((py-r.y0)/r.S*n);
    if(i>=0&&i<n&&j>=0&&j<n){
      const vab=S.view==='slices'? Math.abs(f.data[(i*n+j)*n+SL.k]) : (TP.colmax?TP.colmax[i*n+j]:0);
      setProbe(vab,f.vmax);
    } else AUD.rate=0;
  }
});
cv.addEventListener('pointerup',e=>{ dragging=null; cv.style.cursor=IS3D[S.view]?'grab':'crosshair'; });
cv.addEventListener('pointerleave',()=>{ AUD.rate=0; });
cv.addEventListener('click',e=>{
  if(S.view!=='slices') return;
  const f=curF(), n=f.n, r=rect2D();
  const bb=cv.getBoundingClientRect();
  const px=(e.clientX-bb.left)*DPR, py=(e.clientY-bb.top)*DPR;
  const i=Math.floor((px-r.x0)/r.S*n), j=n-1-Math.floor((py-r.y0)/r.S*n);
  if(i<0||i>=n||j<0||j>=n) return;
  SL.sound.push({i,j,k:SL.k,v:f.data[(i*n+j)*n+SL.k]});
  if(SL.sound.length>24) SL.sound.shift();
});
cv.addEventListener('wheel',e=>{
  e.preventDefault();
  if(IS3D[S.view]) cam.dist=clamp(cam.dist*(1+e.deltaY*0.0012),11,44);
  else if(S.view==='slices'){ SL.k=clamp(SL.k+Math.sign(e.deltaY),0,curF().n-1); SL.stale=true; }
},{passive:false});

['dragenter','dragover'].forEach(ev=>window.addEventListener(ev,e=>{e.preventDefault(); document.body.classList.add('drag');}));
window.addEventListener('dragleave',e=>{ if(!e.relatedTarget) document.body.classList.remove('drag'); });
window.addEventListener('drop',async e=>{
  e.preventDefault(); document.body.classList.remove('drag');
  const file=e.dataTransfer.files&&e.dataTransfer.files[0];
  if(!file) return;
  if(file.size>120e6){ toast('cube too large (>120 MB) — downsample first'); return; }
  try{
    const text=await file.text();
    const fld=parseCube(file.name,text);
    FIELDS.user=fld;
    let opt=document.querySelector('#fieldSel option[value=user]');
    if(!opt){ opt=document.createElement('option'); opt.value='user'; $('fieldSel').appendChild(opt); }
    opt.textContent=file.name.slice(0,18);
    $('fieldSel').value='user';
    setField('user');
    toast('loaded '+file.name+' — '+fld.n+'³ grid, '+fld.atoms.length+' atoms');
  }catch(err){ toast('cube parse failed: '+err.message); }
});

function parseCube(name,text){
  const tok=text.split(/\s+/).filter(s=>s.length);
  let p=0;
  const num=()=>{ const v=parseFloat(tok[p++]); if(!isFinite(v)) throw new Error('bad number near token '+p); return v; };
  let guard=0;
  while(guard<tok.length && !/^-?\d+$/.test(tok[guard])) guard++;
  p=guard;
  let nat=num()|0;
  const orig=[num(),num(),num()];
  const dims=[], step=[];
  for(let a=0;a<3;a++){
    const nv=num()|0; dims.push(Math.abs(nv));
    const ax=[num(),num(),num()];
    step.push(ax[a]);
    if(Math.abs(ax[(a+1)%3])>1e-6||Math.abs(ax[(a+2)%3])>1e-6) throw new Error('non-orthogonal axes unsupported');
  }
  const bohr = true;
  const B2A=0.529177;
  const hasVal=nat<0; nat=Math.abs(nat);
  const atoms=[];
  for(let a=0;a<nat;a++){
    const Z=num()|0; num();
    atoms.push([Z,num(),num(),num()]);
  }
  if(hasVal){ const m=num()|0; for(let q=0;q<m;q++) num(); }
  if(dims[0]!==dims[1]||dims[1]!==dims[2]) throw new Error('only cubic grids supported ('+dims.join('×')+')');
  const ns=dims[0];
  const N=ns*ns*ns;
  if(tok.length-p<N) throw new Error('data truncated: '+(tok.length-p)+' of '+N);
  const raw=new Float32Array(N);
  let vb=0,bi=0;
  for(let q=0;q<N;q++){
    const v=parseFloat(tok[p++]); raw[q]=v;
    const av=Math.abs(v); if(av>vb){vb=av;bi=q;}
  }
  const st=Math.ceil(ns/80);
  const n=Math.floor(ns/st);
  const mi=(bi/(ns*ns))|0, mj=((bi/ns)|0)%ns, mk=bi%ns;
  const half=(n*st)>>1;
  const data=new Float32Array(n*n*n);
  let vmax=0;
  for(let i=0;i<n;i++) for(let j=0;j<n;j++) for(let k=0;k<n;k++){
    const si=(((i*st+mi-half)%ns)+ns)%ns;
    const sj=(((j*st+mj-half)%ns)+ns)%ns;
    const sk=(((k*st+mk-half)%ns)+ns)%ns;
    const v=raw[(si*ns+sj)*ns+sk];
    data[(i*n+j)*n+k]=v;
    if(Math.abs(v)>vmax) vmax=Math.abs(v);
  }
  const box=ns*step[0]*(bohr?B2A:1);
  const L=ns*step[0];
  const cx=(mi+0.5)/ns, cyy=(mj+0.5)/ns, cz=(mk+0.5)/ns;
  const aout=atoms.map(a=>[a[0],
    (((a[1]-orig[0])/L - cx + 0.5)%1+1)%1*L*(bohr?B2A:1)-box/2+0,
    (((a[2]-orig[1])/L - cyy + 0.5)%1+1)%1*L*(bohr?B2A:1)-box/2,
    (((a[3]-orig[2])/L - cz + 0.5)%1+1)%1*L*(bohr?B2A:1)-box/2]);
  const meta={tag:'user', src:name, method:'user cube', n, boxA:box, vmax, t0:vmax*2e-4, natoms:nat};
  return new Field(meta,data,aout);
}

(async()=>{

})();

<script>
"use strict";
VIEWS.find(v=>v.id==='sea').cap='<b>Cartography: nested coastlines.</b> Two contour shells at once — sea level (outer) and a 2× tighter inner shore (brighter), so gaps in the outer shell reveal the next level down instead of void, exactly like hypsometric layers on a map. Readout = fraction of ∫|σ| the outer coast encloses.';
VIEWS.find(v=>v.id==='nodes').cap='<b>How to read this:</b> orange dots = majority-spin regions, blue dots = minority-spin pockets (same ± surfaces as Sea level, drawn as ghosts). The pale <b>mint sheet is the wall between them</b> — the surface where σ(r) crosses zero. On a Chladni plate, this is where the sand settles. An extra wall between two atoms is the visual signature of antibonding character.';
VIEWS.find(v=>v.id==='rain').cap='<b>Watersheds over the cloud.</b> The faint swarm shows where the density lives; tracers climb ∇|σ| through it and drain into basins — trails are gradient paths, endpoints color by capturing atom (gold = C, white = H, gray = Si). Toggle the underlay off to see the skeleton alone.';
VIEWS.find(v=>v.id==='sweep').cap='<b>Radar phosphor / contour stack.</b> Animate: a scan plane sweeps the chosen axis, ±sea-level contours decaying like a CRT trace. Stack: the whole sweep frozen at once — every 2nd slice\'s contours as a wireframe stack (the oldest trick in molecular graphics, and still one of the best). Orange = majority, blue = minority.';
VIEWS.find(v=>v.id==='shadow').cap='<b>Hooke\'s candle, 1665.</b> A projection, not a slice: |σ| integrated along the chosen axis, then differentiated. Along z you are looking at the <b>same x–y frame as Slices and Topograph</b> — cut all three in the same plane for side-by-side reading. Shadowgraph ≈ ∇² of the column (the QTAIM-meaningful field); knife-edge = signed gradient.';
VIEWS.find(v=>v.id==='topo').cap='<b>The spin mountain.</b> Terrain = column-integrated |σ| along z (log-compressed), hillshaded with contour bands — the total spin weight above each (x,y) point, so the defect reads as a single massif with satellite hills on the back-bonds. Same x–y frame as Slices. <b>Illustrative — not Tersoff–Hamann current.</b>';
VIEWS.find(v=>v.id==='topo').sub='column map · minimap';

function extractSurface(f, iso, mode, cap, level){
  cap=cap||MAXS; level=level||0;
  const n=f.n, d=f.data, out=[];
  const eps=Math.max((f.meta.t0||f.vmax*2e-4)*8, f.vmax*0.002);
  for(let i=0;i<n-1;i++) for(let j=0;j<n-1;j++){
    let idx=(i*n+j)*n;
    for(let k=0;k<n-1;k++,idx++){
      const raw=d[idx];
      const a = mode==='abs'? Math.abs(raw) : raw;
      const L = mode==='abs'? iso : 0;
      for(let dir=0;dir<3;dir++){
        const nb = dir===0? d[idx+n*n] : dir===1? d[idx+n] : d[idx+1];
        const b = mode==='abs'? Math.abs(nb) : nb;
        if((a-L)*(b-L)>=0) continue;
        if(mode==='zero' && Math.max(Math.abs(raw),Math.abs(nb))<eps) continue;
        const t=(L-a)/(b-a);
        const x=f.g2w(i)+(dir===0?t*f.box/n:0);
        const y=f.g2w(j)+(dir===1?t*f.box/n:0);
        const z=f.g2w(k)+(dir===2?t*f.box/n:0);
        if(mode==='abs') f.gradAbs(x,y,z,GV); else f.grad(x,y,z,GV);
        const gl=Math.hypot(GV[0],GV[1],GV[2])||1;
        out.push(x,y,z, GV[0]/gl,GV[1]/gl,GV[2]/gl, raw>=0?1:-1, level);
      }
    }
  }
  let m=out.length/8;
  if(m<=cap) return new Float32Array(out);
  const st=Math.ceil(m/cap), res=new Float32Array(Math.ceil(m/st)*8);
  let w=0;
  for(let p=0;p<m;p+=st){ for(let q=0;q<8;q++) res[w*8+q]=out[p*8+q]; w++; }
  return res.subarray(0,w*8);
}
function mergeSplats(a,b){
  const r=new Float32Array(a.length+b.length);
  r.set(a,0); r.set(b,a.length);
  return r;
}
function drawSplats(splats, t, colorFn){
  const m=splats.length/8;
  const zs=new Float32Array(m), xs=new Float32Array(m), ys=new Float32Array(m), ss=new Float32Array(m);
  for(let p=0;p<m;p++){
    proj(splats[p*8],splats[p*8+1],splats[p*8+2],P1);
    xs[p]=P1.x; ys[p]=P1.y; zs[p]=P1.z; ss[p]=P1.s;
  }
  if(!splats.__ord || t-(splats.__ordT||0)>150){
    const idx=new Array(m);
    for(let i=0;i<m;i++) idx[i]=i;
    idx.sort((a,b)=>zs[b]-zs[a]);
    splats.__ord=idx; splats.__ordT=t;
  }
  const Lx=-0.42,Ly=0.58,Lz=0.70;
  for(const p of splats.__ord){
    rotN(splats[p*8+3],splats[p*8+4],splats[p*8+5],NV);
    const d=Math.abs(NV[0]*Lx+NV[1]*Ly+NV[2]*Lz);
    const shade=0.28+0.72*d;
    const r=clamp(0.125*ss[p],1.8*DPR,8*DPR);
    ctx.fillStyle=colorFn(splats[p*8+6], shade, splats[p*8+7]);
    ctx.fillRect(xs[p]-r, ys[p]-r, 2*r, 2*r);
  }
}
function invalidate(all){
  S.splats=null; S.splats2=null; TP.key=''; SWEEP.lastK=-1; SWEEP.stack=null;
  if(all){ S.nodeSplats=null; SL.stale=true; SL.sound=[]; RAIN.list=null; SWEEP.segs=[]; SH.cache={}; }
}

VIEW_FN.sea=(t)=>{
  const f=curF();
  if(!S.splats){
    const outer=extractSurface(f,S.iso,'abs',40000,0);
    const iso2=f.isoForFrac(Math.max(0.15,S.frac*0.5));
    const inner=extractSurface(f,iso2,'abs',20000,1);
    S.splats=mergeSplats(outer,inner);
  }
  clearBG(); drawFloor(f);
  const fy=floorY(f), m=S.splats.length/8;
  ctx.fillStyle='rgba(0,0,0,0.35)';
  for(let p=0;p<m;p+=9){
    proj(S.splats[p*8],fy,S.splats[p*8+2],P1);
    ctx.beginPath(); ctx.ellipse(P1.x,P1.y,0.16*P1.s,0.06*P1.s,0,0,6.29); ctx.fill();
  }
  drawSkeleton(f,0.85);
  drawSplats(S.splats,t,(sg,shade,lv)=>{
    if(lv>0.5) return sg>0
      ? `rgb(${(255*shade)|0},${(216*shade)|0},${(160*shade)|0})`
      : `rgb(${(196*shade)|0},${(226*shade)|0},${(255*shade)|0})`;
    return sg>0
      ? `rgb(${(235*shade)|0},${(140*shade)|0},${(70*shade)|0})`
      : `rgb(${(88*shade)|0},${(140*shade)|0},${(235*shade)|0})`;
  });
};

VIEW_FN.nodes=(t)=>{
  const f=curF();
  if(!S.nodeSplats){
    const sheet=extractSurface(f,0,'zero',26000,1);
    const ctxt=extractSurface(f,S.iso,'abs',12000,0);
    S.nodeSplats=mergeSplats(ctxt,sheet);
  }
  clearBG(); drawSkeleton(f,0.95);
  drawSplats(S.nodeSplats,t,(sg,shade,lv)=>{
    if(lv>0.5) return `rgb(${(178*shade+30)|0},${(226*shade+29)|0},${(198*shade+30)|0})`;
    return sg>0?'rgba(245,162,94,0.16)':'rgba(111,166,255,0.16)';
  });
};

RAIN.under=true;
VIEW_FN.rain=(t)=>{
  const f=curF();
  if(!RAIN.list){ RAIN.list=[]; for(let i=0;i<620;i++){ const w={}; rainSpawn(f,w); RAIN.list.push(w); } }
  clearBG(); drawFloor(f);
  if(RAIN.under){
    const P=f.pts;
    for(let i=0;i<P.length;i+=8){
      proj(P[i],P[i+1],P[i+2],P1);
      ctx.fillStyle=P[i+3]>0?'rgba(245,162,94,0.13)':'rgba(111,166,255,0.13)';
      ctx.fillRect(P1.x-1.1*DPR,P1.y-1.1*DPR,2.2*DPR,2.2*DPR);
    }
  }
  drawSkeleton(f,1);
  const A=f.atoms;
  for(const w of RAIN.list){
    if(w.state===0){
      for(let s=0;s<2;s++){
        f.gradAbs(w.x,w.y,w.z,GV);
        const gl=Math.hypot(GV[0],GV[1],GV[2]);
        const val=Math.abs(f.sample(w.x,w.y,w.z));
        if(val>0.42*f.vmax || (gl<f.vmax*0.02 && val>f.vmax*0.01) || (gl<f.vmax*0.002)){
          w.state=1; w.doneT=t;
          let best=1e9,bi=-1;
          for(let ai=0;ai<A.length;ai++){
            const dx=A[ai][1]-w.x, dy=A[ai][2]-w.y, dz=A[ai][3]-w.z;
            const dd=dx*dx+dy*dy+dz*dz;
            if(dd<best){best=dd;bi=ai;}
          }
          w.cls=bi;
          break;
        }
        w.x+=GV[0]/gl*0.055; w.y+=GV[1]/gl*0.055; w.z+=GV[2]/gl*0.055;
        w.hist.push(w.x,w.y,w.z);
        if(w.hist.length>141) w.hist.splice(0,3);
      }
    } else if(t-w.doneT>1300){ rainSpawn(f,w); continue; }
    const hlen=w.hist.length/3;
    if(hlen<2) continue;
    let col='109,138,178', alpha=0.5;
    if(w.state===1){
      const Z=A[w.cls]?A[w.cls][0]:14;
      col = Z===6?'255,209,102' : Z===1?'232,237,245' : '127,138,160';
      alpha = 0.85*Math.max(0,1-(t-w.doneT)/1300);
    }
    ctx.strokeStyle=`rgba(${col},${alpha.toFixed(3)})`;
    ctx.lineWidth=1.1*DPR;
    ctx.beginPath();
    for(let hh=0;hh<hlen;hh++){
      proj(w.hist[hh*3],w.hist[hh*3+1],w.hist[hh*3+2],P1);
      if(hh===0) ctx.moveTo(P1.x,P1.y); else ctx.lineTo(P1.x,P1.y);
    }
    ctx.stroke();
    proj(w.x,w.y,w.z,P1);
    ctx.fillStyle=`rgba(${col},${Math.min(1,alpha+0.2).toFixed(3)})`;
    ctx.fillRect(P1.x-1.4*DPR,P1.y-1.4*DPR,2.8*DPR,2.8*DPR);
  }
};

const AXN=['x','y','z'];
function axPoint(ax,u,v,w,out){
  if(ax===0){ out[0]=w; out[1]=u; out[2]=v; }
  else if(ax===1){ out[0]=u; out[1]=w; out[2]=v; }
  else { out[0]=u; out[1]=v; out[2]=w; }
  return out;
}
function sliceGetter(f,ax,k){
  const n=f.n, d=f.data;
  if(ax===0) return (u,v)=>d[(k*n+u)*n+v];
  if(ax===1) return (u,v)=>d[(u*n+k)*n+v];
  return (u,v)=>d[(u*n+v)*n+k];
}
function colAxis(f,ax){
  f._col=f._col||{};
  if(f._col[ax]) return f._col[ax];
  const n=f.n, d=f.data, c=new Float32Array(n*n);
  for(let u=0;u<n;u++) for(let v=0;v<n;v++){
    let s=0;
    for(let k=0;k<n;k++){
      const idx = ax===0? (k*n+u)*n+v : ax===1? (u*n+k)*n+v : (u*n+v)*n+k;
      s+=Math.abs(d[idx]);
    }
    c[u*n+v]=s;
  }
  f._col[ax]=c; return c;
}

SWEEP.mode=QS.get('sweepmode')==='stack'?'stack':'anim';
SWEEP.axis=+(QS.get('sweepaxis')||2); SWEEP.stack=null; SWEEP.stackKey='';
const AXP=[0,0,0];
function sweepSegsAt(f,ax,k,t,into){
  const n=f.n, get=sliceGetter(f,ax,k), zp=f.g2w(k);
  for(const L of [S.iso,-S.iso]){
    const segs=[];
    msq(get,n,L,segs);
    for(const sg of segs){
      axPoint(ax,f.g2w(sg[0][0]),f.g2w(sg[0][1]),zp,AXP);
      const ax0=AXP[0],ay0=AXP[1],az0=AXP[2];
      axPoint(ax,f.g2w(sg[1][0]),f.g2w(sg[1][1]),zp,AXP);
      into.push({ax:ax0,ay:ay0,az:az0,bx:AXP[0],by:AXP[1],bz:AXP[2],s:L>=0?1:-1,born:t});
    }
  }
}
VIEW_FN.sweep=(t)=>{
  const f=curF(), n=f.n, ax=SWEEP.axis;
  clearBG(); drawSkeleton(f,0.7);
  if(SWEEP.mode==='anim'){
    const zw=0.46*f.box*Math.sin(t*4.2e-4);
    const k=clamp(Math.round(f.w2g(zw)),1,n-2);
    if(k!==SWEEP.lastK){
      SWEEP.lastK=k;
      sweepSegsAt(f,ax,k,t,SWEEP.segs);
      if(SWEEP.segs.length>9000) SWEEP.segs.splice(0,SWEEP.segs.length-9000);
    }
    SWEEP.segs=SWEEP.segs.filter(sg=>t-sg.born<2600);
    const hb=f.box*0.49;
    ctx.strokeStyle='rgba(220,230,245,0.13)'; ctx.lineWidth=1*DPR;
    ctx.beginPath();
    axPoint(ax,-hb,-hb,zw,AXP); proj(AXP[0],AXP[1],AXP[2],P1); ctx.moveTo(P1.x,P1.y);
    axPoint(ax, hb,-hb,zw,AXP); proj(AXP[0],AXP[1],AXP[2],P1); ctx.lineTo(P1.x,P1.y);
    axPoint(ax, hb, hb,zw,AXP); proj(AXP[0],AXP[1],AXP[2],P1); ctx.lineTo(P1.x,P1.y);
    axPoint(ax,-hb, hb,zw,AXP); proj(AXP[0],AXP[1],AXP[2],P1); ctx.lineTo(P1.x,P1.y);
    ctx.closePath(); ctx.stroke();
    ctx.lineWidth=1.4*DPR;
    for(const sg of SWEEP.segs){
      const a=Math.exp(-(t-sg.born)/950);
      ctx.strokeStyle=sg.s>0?`rgba(245,162,94,${(0.95*a).toFixed(3)})`:`rgba(111,166,255,${(0.95*a).toFixed(3)})`;
      proj(sg.ax,sg.ay,sg.z===undefined?sg.az:sg.az,P1); proj(sg.bx,sg.by,sg.bz,P2);
      ctx.beginPath(); ctx.moveTo(P1.x,P1.y); ctx.lineTo(P2.x,P2.y); ctx.stroke();
    }
  } else {
    const key=S.fieldKey+':'+ax+':'+S.iso;
    if(!SWEEP.stack||SWEEP.stackKey!==key){
      const into=[];
      for(let k=1;k<n-1;k+=2) sweepSegsAt(f,ax,k,0,into);
      SWEEP.stack=into; SWEEP.stackKey=key;
    }
    ctx.lineWidth=1.1*DPR;
    for(const sgn of [1,-1]){
      ctx.strokeStyle=sgn>0?'rgba(245,162,94,0.55)':'rgba(111,166,255,0.60)';
      ctx.beginPath();
      for(const sg of SWEEP.stack){
        if(sg.s!==sgn) continue;
        proj(sg.ax,sg.ay,sg.az,P1); proj(sg.bx,sg.by,sg.bz,P2);
        ctx.moveTo(P1.x,P1.y); ctx.lineTo(P2.x,P2.y);
      }
      ctx.stroke();
    }
  }
};

SH.axis=2;
VIEW_FN.shadow=(t)=>{
  const f=curF(), n=f.n, ax=SH.axis;
  const key=S.fieldKey+':'+SH.mode+':'+ax+':'+n;
  if(!SH.cache[key]){
    const I=colAxis(f,ax);
    const os=document.createElement('canvas'); os.width=os.height=n;
    const g=os.getContext('2d'), img=g.createImageData(n,n);
    const val=new Float32Array(n*n);
    let ss=0, cnt=0;
    for(let u=1;u<n-1;u++) for(let v=1;v<n-1;v++){
      let x;
      if(SH.mode==='shadow') x=I[(u+1)*n+v]+I[(u-1)*n+v]+I[u*n+v+1]+I[u*n+v-1]-4*I[u*n+v];
      else if(SH.mode==='knife') x=(I[(u+1)*n+v]-I[(u-1)*n+v])*0.5;
      else x=I[u*n+v];
      val[u*n+v]=x; ss+=x*x; cnt++;
    }
    const rms=Math.sqrt(ss/cnt)||1;
    let imax=0; for(let q=0;q<n*n;q++) imax=Math.max(imax,val[q]);
    for(let v=0;v<n;v++) for(let u=0;u<n;u++){
      const o=((n-1-v)*n+u)*4;
      const x=val[u*n+v];
      let rr,gg,bb;
      if(SH.mode==='shadow'){
        const gray=clamp(0.5+x/(6*rms),0.02,0.98)*255;
        rr=gg=gray; bb=gray*1.04;
      } else if(SH.mode==='knife'){
        const tt=clamp(x/(3.5*rms),-1,1);
        rr=128+115*tt; gg=128+34*tt; bb=128-115*tt;
      } else {
        const tt=clamp(Math.asinh(x/(imax/40))/Math.asinh(40),0,1);
        rr=gg=tt*235; bb=tt*255;
      }
      img.data[o]=rr; img.data[o+1]=gg; img.data[o+2]=bb; img.data[o+3]=255;
    }
    g.putImageData(img,0,0);
    SH.cache[key]=os;
  }
  clearBG();
  const r=rect2D();
  ctx.imageSmoothingEnabled=true;
  ctx.drawImage(SH.cache[key],r.x0,r.y0,r.S,r.S);
  frameRect(r); scaleBar(r,f.box);
  const free=['y–z','x–z','x–y'][ax];
  const match=ax===2?' · same frame as Slices/Topograph':'';
  const md=SH.mode==='shadow'?'∇²':SH.mode==='knife'?'knife-edge ∂':'∫';
  hudText(`${free} plane · ${md} of ∫|σ| d${AXN[ax]}${match}`);
};

VIEW_FN.topo=(t)=>{
  const f=curF(), n=f.n;
  if(TP.key!==S.fieldKey||!TP.os){
    TP.key=S.fieldKey;

      const L = mode==='abs'? iso : 0;
      for(let dir=0;dir<3;dir++){
        const nIdx = dir===0? idx+n*n : dir===1? idx+n : idx+1;
        if(msk&&!msk[nIdx]) continue;

    const i=gi|0, j=gj|0, k=gk|0;
    const fx=gi-i, fy=gj-j, fz=gk-k;
    i1=(i+1)%n1; j1=(j+1)%n2; k1=(k+1)%n3;
    const v000=raw[(i*n2+j)*n3+k], v100=raw[(i1*n2+j)*n3+k], v010=raw[(i*n2+j1)*n3+k], v110=raw[(i1*n2+j1)*n3+k];
    const v001=raw[(i*n2+j)*n3+k1], v101=raw[(i1*n2+j)*n3+k1], v011=raw[(i*n2+j1)*n3+k1], v111=raw[(i1*n2+j1)*n3+k1];
    const v00=v000+(v100-v000)*fx, v10=v010+(v110-v010)*fx;
    const v01=v001+(v101-v001)*fx, v11=v011+(v111-v011)*fx;
    const v0=v00+(v10-v00)*fy, v1=v01+(v11-v01)*fy;
    return v0+(v1-v0)*fz;
  }
  let vmax=0;
  const mask = periodic? null : new Uint8Array(n*n*n);
  for(let ti=0;ti<n;ti++) for(let tj=0;tj<n;tj++) for(let tk=0;tk<n;tk++){
    const rx=cx+((ti+0.5)/n-0.5)*L, ry=cyy+((tj+0.5)/n-0.5)*L, rz=cz+((tk+0.5)/n-0.5)*L;
    const dx=rx-O[0], dy=ry-O[1], dz=rz-O[2];
    const gi=inv[0][0]*dx+inv[0][1]*dy+inv[0][2]*dz;
    const gj=inv[1][0]*dx+inv[1][1]*dy+inv[1][2]*dz;
    const gk=inv[2][0]*dx+inv[2][1]*dy+inv[2][2]*dz;
    let valid=1;
    if(!periodic&&(gi<-0.001||gi>n1-0.999||gj<-0.001||gj>n2-0.999||gk<-0.001||gk>n3-0.999)) valid=0;
    const ii=(ti*n+tj)*n+tk;
    if(mask) mask[ii]=valid;
    const v=valid? sampleRaw(gi,gj,gk) : 0;
    data[ii]=v;
    const av=Math.abs(v); if(av>vmax) vmax=av;
  }
  let validBox=null;
  if(!periodic&&!offdiag){
    validBox={lo:[O[0]-cx, O[1]-cyy, O[2]-cz],
              hi:[O[0]-cx+S[0][0]*n1, O[1]-cyy+S[1][1]*n2, O[2]-cz+S[2][2]*n3]};
  }
  const aout=atomsIn.map(a=>{
    const dx=a[1]-O[0], dy=a[2]-O[1], dz=a[3]-O[2];
    const ri=periodic?i0:n1/2, rj=periodic?j0:n2/2, rk=periodic?k0:n3/2;
    let gi=inv[0][0]*dx+inv[0][1]*dy+inv[0][2]*dz - ri;
    let gj=inv[1][0]*dx+inv[1][1]*dy+inv[1][2]*dz - rj;
    let gk=inv[2][0]*dx+inv[2][1]*dy+inv[2][2]*dz - rk;
    if(periodic){ gi-=Math.round(gi/n1)*n1; gj-=Math.round(gj/n2)*n2; gk-=Math.round(gk/n3)*n3; }
    return [a[0],
      S[0][0]*gi+S[0][1]*gj+S[0][2]*gk,
      S[1][0]*gi+S[1][1]*gj+S[1][2]*gk,
      S[2][0]*gi+S[2][1]*gj+S[2][2]*gk];
  });
  const meta={tag:'user', src:name, validBox,
    method:'user cube · resampled to cubic'+(offdiag?' (triclinic cell)':'')+(periodic?' · periodic, recentered on |v|max':' · isolated, box-centered, no wrap'),
    n, boxA:L, vmax, t0:vmax*2e-4, natoms:nat};
  const fld=new Field(meta,data,aout);
  fld.mask=mask;
  return fld;
}
</script>
<script>
"use strict";
VIEWS.find(v=>v.id==='fog').cap='<b>Two fogs.</b> Additive: the mud we started from — everything sums to white. Shaded: the volume-rendering fix — the same 4,500 samples lit by the local density gradient and composited back-to-front, with depth cueing. The cloud gains form; surfaces still beat it for structure, but now it is a fair fight.';
VIEWS.find(v=>v.id==='sea').cap='<b>Isosurface explorer.</b> Shells ×2/×4 = nested coastlines, log-spaced, brighter inward; cutaway clips the camera-side half to tunnel through them; flood animates sea level through the whole range — watch lobes emerge, merge and drown. Readout = enclosed fraction of ∫|σ|.';
VIEWS.find(v=>v.id==='sweep').cap='<b>Radar phosphor / contour stack.</b> Animate sweeps a plane (or three, phase-shifted, on "all"); stack freezes the whole sweep as wireframe. <b>"all" + stack = the egg-crate:</b> x, y and z contour families woven together — the oldest full-3D surface representation there is, and still one of the most legible. Orange = majority, blue = minority.';

const FOG={mode: QS.get('fogmode')==='shaded'?'shaded':'mud'};
const SEA={shells: +(QS.get('shells')||2), flood:false};
const FLOOD={key:'', arr:[], steps:26};
S.cut = QS.get('cut')==='1' ? true : S.cut;
SWEEP.lastKs=[-1,-1,-1];

function fogNormals(f){
  if(f._ptsN) return f._ptsN;
  const P=f.pts, K=P.length/4, N=new Float32Array(K*3);
  for(let i=0;i<K;i++){
    f.gradAbs(P[i*4],P[i*4+1],P[i*4+2],GV);
    const gl=Math.hypot(GV[0],GV[1],GV[2])||1;
    N[i*3]=GV[0]/gl; N[i*3+1]=GV[1]/gl; N[i*3+2]=GV[2]/gl;
  }
  f._ptsN=N; return N;
}
const FOGSPR={};
function fogSprite(sign,q){
  const key=sign+'_'+q;
  if(FOGSPR[key]) return FOGSPR[key];
  const shade=0.30+0.70*(q/7);
  const base=sign>0?[245,162,94]:[111,166,255];
  const c=[Math.min(255,base[0]*shade+35*shade),Math.min(255,base[1]*shade+35*shade),Math.min(255,base[2]*shade+35*shade)];
  const cv2=document.createElement('canvas'); cv2.width=cv2.height=64;
  const g=cv2.getContext('2d');
  const gr=g.createRadialGradient(32,32,0,32,32,32);
  gr.addColorStop(0,`rgba(${c[0]|0},${c[1]|0},${c[2]|0},0.34)`);
  gr.addColorStop(1,`rgba(${c[0]|0},${c[1]|0},${c[2]|0},0)`);
  g.fillStyle=gr; g.fillRect(0,0,64,64);
  FOGSPR[key]=cv2; return cv2;
}
VIEW_FN.fog=(t)=>{
  const f=curF(); clearBG();
  drawSkeleton(f,0.9);
  const P=f.pts, K=P.length/4;
  if(FOG.mode==='mud'){
    ctx.globalCompositeOperation='lighter';
    for(let i=0;i<K;i++){
      proj(P[i*4],P[i*4+1],P[i*4+2],P1);
      const r=0.5*P1.s;
      ctx.drawImage(P[i*4+3]>0?SPR_POS:SPR_NEG, P1.x-r, P1.y-r, 2*r, 2*r);
    }
    ctx.globalCompositeOperation='source-over';
    return;
  }
  const N=fogNormals(f);
  const zs=new Float32Array(K), xs=new Float32Array(K), ys=new Float32Array(K), ss=new Float32Array(K);
  for(let i=0;i<K;i++){ proj(P[i*4],P[i*4+1],P[i*4+2],P1); xs[i]=P1.x; ys[i]=P1.y; zs[i]=P1.z; ss[i]=P1.s; }
  const order=sortByDepth(K,i=>zs[i]);
  const Lx=-0.42,Ly=0.58,Lz=0.70;
  for(const i of order){
    rotN(N[i*3],N[i*3+1],N[i*3+2],NV);
    const d=Math.abs(NV[0]*Lx+NV[1]*Ly+NV[2]*Lz);
    const q=Math.min(7,(d*8)|0);
    ctx.globalAlpha=clamp(1.9-zs[i]/cam.dist,0.35,1);
    const r=0.42*ss[i];
    ctx.drawImage(fogSprite(P[i*4+3]>0?1:-1,q), xs[i]-r, ys[i]-r, 2*r, 2*r);
  }
  ctx.globalAlpha=1;
};

const SEA_POS=[[235,140,70],[255,178,110],[255,208,150],[255,234,200]];
const SEA_NEG=[[88,140,235],[130,175,250],[175,205,255],[215,232,255]];
function seaColor(sg,shade,lv){
  const pal=sg>0?SEA_POS:SEA_NEG;
  const c=pal[Math.min(3,lv|0)];
  return `rgb(${(c[0]*shade)|0},${(c[1]*shade)|0},${(c[2]*shade)|0})`;
}
VIEW_FN.sea=(t)=>{
  const f=curF();
  if(SEA.flood){
    if(FLOOD.key!==S.fieldKey){ FLOOD.key=S.fieldKey; FLOOD.arr=new Array(FLOOD.steps).fill(null); }
    const phase=(Math.sin(t*1.6e-4)+1)/2;
    const idx=Math.round(phase*(FLOOD.steps-1));
    if(!FLOOD.arr[idx]){
      const fr=1-Math.pow(10,-(0.25+2.75*idx/(FLOOD.steps-1)));
      const sp=extractSurface(f, f.isoForFrac(fr), 'abs', 30000, Math.round(3*idx/(FLOOD.steps-1)));
      sp.__frac=fr; FLOOD.arr[idx]=sp;
    }
    clearBG(); drawFloor(f); drawSkeleton(f,0.85);
    const sp=FLOOD.arr[idx];
    drawSplats(sp,t,seaColor);
    $('isoRead').innerHTML=`flooding · encloses ${(sp.__frac*100).toFixed(1)}% of ∫|σ|`;
    return;
  }
  if(!S.splats){
    const cnt=SEA.shells, cap=Math.floor(42000/cnt), parts=[];
    for(let l=0;l<cnt;l++){
      const fr=Math.max(0.05, S.frac*Math.pow(0.55,l));
      parts.push(extractSurface(f, f.isoForFrac(fr), 'abs', cap, cnt===2? l*1 : l));
    }
    let total=parts[0];
    for(let l=1;l<cnt;l++) total=mergeSplats(total,parts[l]);
    S.splats=total;
  }
  clearBG(); drawFloor(f);
  const fy=floorY(f), m=S.splats.length/8;
  ctx.fillStyle='rgba(0,0,0,0.35)';
  for(let p=0;p<m;p+=9){
    proj(S.splats[p*8],fy,S.splats[p*8+2],P1);
    ctx.beginPath(); ctx.ellipse(P1.x,P1.y,0.16*P1.s,0.06*P1.s,0,0,6.29); ctx.fill();
  }
  drawSkeleton(f,0.85);
  drawSplats(S.splats,t,seaColor);
};

VIEW_FN.sweep=(t)=>{
  const f=curF(), n=f.n;
  clearBG(); drawSkeleton(f,0.7);
  const axes = SWEEP.axis===3? [0,1,2] : [SWEEP.axis];
  if(SWEEP.mode==='anim'){
    const hb=f.box*0.49;
    for(const ax of axes){
      const zw=0.46*f.box*Math.sin(t*4.2e-4+ax*2.09);
      const k=clamp(Math.round(f.w2g(zw)),1,n-2);
      if(k!==SWEEP.lastKs[ax]){
        SWEEP.lastKs[ax]=k;
        sweepSegsAt(f,ax,k,t,SWEEP.segs);
        if(SWEEP.segs.length>12000) SWEEP.segs.splice(0,SWEEP.segs.length-12000);
      }
      ctx.strokeStyle='rgba(220,230,245,0.11)'; ctx.lineWidth=1*DPR;
      ctx.beginPath();
      axPoint(ax,-hb,-hb,zw,AXP); proj(AXP[0],AXP[1],AXP[2],P1); ctx.moveTo(P1.x,P1.y);
      axPoint(ax, hb,-hb,zw,AXP); proj(AXP[0],AXP[1],AXP[2],P1); ctx.lineTo(P1.x,P1.y);
      axPoint(ax, hb, hb,zw,AXP); proj(AXP[0],AXP[1],AXP[2],P1); ctx.lineTo(P1.x,P1.y);
      axPoint(ax,-hb, hb,zw,AXP); proj(AXP[0],AXP[1],AXP[2],P1); ctx.lineTo(P1.x,P1.y);
      ctx.closePath(); ctx.stroke();
    }
    SWEEP.segs=SWEEP.segs.filter(sg=>t-sg.born<2600);
    ctx.lineWidth=1.4*DPR;
    for(const sg of SWEEP.segs){
      const a=Math.exp(-(t-sg.born)/950);
      ctx.strokeStyle=sg.s>0?`rgba(245,162,94,${(0.95*a).toFixed(3)})`:`rgba(111,166,255,${(0.95*a).toFixed(3)})`;
      proj(sg.ax,sg.ay,sg.az,P1); proj(sg.bx,sg.by,sg.bz,P2);
      ctx.beginPath(); ctx.moveTo(P1.x,P1.y); ctx.lineTo(P2.x,P2.y); ctx.stroke();
    }
  } else {
    const key=S.fieldKey+':'+SWEEP.axis+':'+S.iso;
    if(!SWEEP.stack||SWEEP.stackKey!==key){
      const into=[], step=axes.length>1?3:2;
      for(const ax of axes) for(let k=1;k<n-1;k+=step) sweepSegsAt(f,ax,k,0,into);
      SWEEP.stack=into; SWEEP.stackKey=key;
    }
    ctx.lineWidth=1.05*DPR;
    for(const sgn of [1,-1]){
      ctx.strokeStyle=sgn>0?'rgba(245,162,94,0.5)':'rgba(111,166,255,0.55)';
      ctx.beginPath();
      for(const sg of SWEEP.stack){
        if(sg.s!==sgn) continue;
        proj(sg.ax,sg.ay,sg.az,P1); proj(sg.bx,sg.by,sg.bz,P2);
        ctx.moveTo(P1.x,P1.y); ctx.lineTo(P2.x,P2.y);
      }
      ctx.stroke();
    }
  }
};

function invalidate(all){
  S.splats=null; S.splats2=null; TP.key=''; SWEEP.lastK=-1; SWEEP.lastKs=[-1,-1,-1]; SWEEP.stack=null;
  if(all){ S.nodeSplats=null; SL.stale=true; SL.sound=[]; RAIN.list=null; SWEEP.segs=[]; SH.cache={}; FLOOD.key=''; FLOOD.arr=[]; }
}
function setIsoFromFrac(){
  SEA.flood=false;
  S.iso=curF().isoForFrac(S.frac);
  invalidate(false); readout();
  if(S.view==='sea') buildHud('sea');
}
function buildHud(id){
  const h=$('hud'); h.innerHTML='';
  if(id==='fog'){
    h.appendChild(hbtn('additive mud', FOG.mode==='mud', ()=>{FOG.mode='mud'; buildHud(id);}));
    h.appendChild(hbtn('shaded', FOG.mode==='shaded', ()=>{FOG.mode='shaded'; buildHud(id);}));
  }
  if(id==='slices'){
    for(const wk of ['core','valence','tails'])
      h.appendChild(hbtn(wk, SL.wKey===wk, ()=>{SL.wKey=wk; SL.mode='field'; SL.stale=true; buildHud(id);}));
    h.appendChild(hbtn('HSE vs PBE', SL.mode==='comp', ()=>{SL.mode=SL.mode==='comp'?'field':'comp'; SL.stale=true; buildHud(id);}));
    h.appendChild(hbtn('clear pins', false, ()=>{SL.sound=[];}));
  }
  if(id==='shadow'){
    for(const md of [['shadow','shadowgraph'],['knife','knife-edge'],['column','plain column']])
      h.appendChild(hbtn(md[1], SH.mode===md[0], ()=>{SH.mode=md[0]; buildHud(id);}));
    for(let a=0;a<3;a++)
      h.appendChild(hbtn('∫'+AXN[a], SH.axis===a, ()=>{SH.axis=a; buildHud(id);}));
  }
  if(id==='sweep'){
    h.appendChild(hbtn('animate', SWEEP.mode==='anim', ()=>{SWEEP.mode='anim'; SWEEP.segs=[]; SWEEP.lastKs=[-1,-1,-1]; buildHud(id);}));
    h.appendChild(hbtn('stack', SWEEP.mode==='stack', ()=>{SWEEP.mode='stack'; SWEEP.stack=null; buildHud(id);}));
    for(let a=0;a<3;a++)
      h.appendChild(hbtn(AXN[a], SWEEP.axis===a, ()=>{SWEEP.axis=a; SWEEP.segs=[]; SWEEP.lastKs=[-1,-1,-1]; SWEEP.stack=null; buildHud(id);}));
    h.appendChild(hbtn('all', SWEEP.axis===3, ()=>{SWEEP.axis=3; SWEEP.segs=[]; SWEEP.lastKs=[-1,-1,-1]; SWEEP.stack=null; buildHud(id);}));
  }
  if(id==='rain'){
    h.appendChild(hbtn('swarm underlay', RAIN.under, ()=>{RAIN.under=!RAIN.under; buildHud(id);}));
  }
  if(id==='sea'){
    h.appendChild(hbtn('shells ×2', SEA.shells===2&&!SEA.flood, ()=>{SEA.shells=2; SEA.flood=false; S.splats=null; buildHud(id);}));
    h.appendChild(hbtn('shells ×4', SEA.shells===4&&!SEA.flood, ()=>{SEA.shells=4; SEA.flood=false; S.splats=null; buildHud(id);}));
    h.appendChild(hbtn('flood', SEA.flood, ()=>{SEA.flood=!SEA.flood; if(!SEA.flood) readout(); buildHud(id);}));
    h.appendChild(hbtn('cutaway', S.cut, ()=>{S.cut=!S.cut; buildHud(id);}));
  }
  if(id==='nodes'){
    h.appendChild(hbtn('cutaway', S.cut, ()=>{S.cut=!S.cut; buildHud(id);}));
  }
}
for(const k of ['fog','sea','sweep']){
  const orig=VIEW_FN[k];
  VIEW_FN[k]=(t)=>{
    try{ orig(t); }
    catch(e){ console.error(e); toast('view error ('+k+'): '+e.message); }
  };
}
</script>
<script>
"use strict";
FLOOD.steps=30;
SEA.flood = QS.get('flood')==='1' ? true : SEA.flood;
const FL_A0=Math.log10(1-0.30), FL_A1=Math.log10(1-0.92);
VIEW_FN.sea=(t)=>{
  const f=curF();
  if(!FLOOD.qsApplied){ FLOOD.qsApplied=true; if(QS.get('flood')==='1'){ SEA.flood=true; buildHud('sea'); } }
  if(SEA.flood){
    if(FLOOD.key!==S.fieldKey){ FLOOD.key=S.fieldKey; FLOOD.arr=new Array(FLOOD.steps).fill(null); }
    const ph=(t*8.3e-5)%2;
    const tri=ph<1?ph:2-ph;
    const idx=Math.round(tri*(FLOOD.steps-1));
    if(!FLOOD.arr[idx]){
      const s=idx/(FLOOD.steps-1);
      const fr=1-Math.pow(10, FL_A0+(FL_A1-FL_A0)*s);
      const lv=Math.round(3*(1-s));
      const sp=extractSurface(f, f.isoForFrac(fr), 'abs', 30000, lv);
      sp.__frac=fr; FLOOD.arr[idx]=sp;
    }
    clearBG(); drawFloor(f); drawSkeleton(f,0.85);
    const sp=FLOOD.arr[idx];
    drawSplats(sp,t,seaColor);
    $('isoRead').innerHTML=`flooding · encloses ${(sp.__frac*100).toFixed(1)}% of ∫|σ|`;
    return;
  }
  if(!S.splats){
    const cnt=SEA.shells, cap=Math.floor(42000/cnt), parts=[];
    for(let l=0;l<cnt;l++){
      const fr=Math.max(0.05, S.frac*Math.pow(0.55,l));
      parts.push(extractSurface(f, f.isoForFrac(fr), 'abs', cap, cnt===2? l*1 : l));
    }
    let total=parts[0];
    for(let l=1;l<cnt;l++) total=mergeSplats(total,parts[l]);
    S.splats=total;
  }
  clearBG(); drawFloor(f);
  const fy=floorY(f), m=S.splats.length/8;
  ctx.fillStyle='rgba(0,0,0,0.35)';
  for(let p=0;p<m;p+=9){
    proj(S.splats[p*8],fy,S.splats[p*8+2],P1);
    ctx.beginPath(); ctx.ellipse(P1.x,P1.y,0.16*P1.s,0.06*P1.s,0,0,6.29); ctx.fill();
  }
  drawSkeleton(f,0.85);
  drawSplats(S.splats,t,seaColor);
};
{
  const orig=VIEW_FN.sea;
  VIEW_FN.sea=(t)=>{
    try{ orig(t); }
    catch(e){ console.error(e); toast('view error (sea): '+e.message); }
  };
}
</script>
